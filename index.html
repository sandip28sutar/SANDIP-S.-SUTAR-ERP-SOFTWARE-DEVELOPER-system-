<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SANDIP S. SUTAR ERP</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif}
.header-image{width:100%;display:block;height:auto}
.bottom{min-height:125px;background:linear-gradient(90deg,#3a1c08,#4b250c,#321706);color:#fff;display:flex;align-items:center;gap:24px;padding:0 22px;overflow-x:auto}
.home{font-size:25px;font-weight:bold;white-space:nowrap;border-right:1px solid #9a7047;padding-right:25px}
.menu{background:#fff;color:#111;border-radius:7px;padding:10px 18px;font-size:32px;white-space:nowrap}
.admin{font-size:23px;display:flex;align-items:center;gap:10px;white-space:nowrap}
.badge{background:#f4eadb;color:#222;border-radius:18px;padding:8px 14px;font-size:17px}
.date{font-size:20px;border-left:1px solid #b08a62;padding-left:25px;white-space:nowrap}
.cloud{font-size:18px;white-space:nowrap}
.branch{margin-left:auto;background:#fff;color:#222;border-radius:8px;padding:14px 18px;font-size:20px;white-space:nowrap}
.language-wrap{display:flex;align-items:center;gap:10px;font-size:18px;white-space:nowrap}
.language{background:#fff;color:#222;border-radius:8px;padding:14px 18px;font-size:20px}
@media(max-width:700px){
 .bottom{min-height:105px;padding:0 12px;gap:14px}
 .home{font-size:17px;padding-right:15px}
 .admin{font-size:17px}
 .date{font-size:16px;padding-left:15px}
 .branch,.language{font-size:16px;padding:11px 13px}
 .menu{font-size:27px;padding:8px 14px}
}
</style>
</head>
<body>

<!-- Header image supplied by SANDIP S. SUTAR -->
<img class="header-image" src="header.png" alt="SANDIP S. SUTAR - ERP & App Developer Header">

<nav class="bottom">
  <div class="home">🏠 SANDIP S. SUTAR ERP</div>
  <div class="menu">☰</div>
  <div class="admin">👤 Administrator <span class="badge">Admin</span></div>
  <div class="date">📅<br>24/08/2026</div>
  <div class="cloud">☁️<br>Cloud: Login</div>
  <div>🔔</div>
  <div class="branch">🏢 Main Branch ▾</div>
  <div class="language-wrap">🌐 Language <span class="language">English ▾</span></div>
</nav>

<script>if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
</body>
</html>
